# uv workspace root. It is virtual: it builds no package of its own, only the members below.
# Install everything with: uv sync --all-packages --all-extras
[tool.uv.workspace]
members = ["packages/triage", "packages/ioc-report"]

# The demo, fixture and repository scripts (`demo/`, `fixtures/`, `scripts/`); each package keeps its
# own settings.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages", "demo/work", "demo/work-small"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["demo", "fixtures", "scripts"]
exclude = ["demo/work/", "demo/work-small/"]

# scapy is only installed by `make zeek-fixture` (inline script metadata), never in the workspace.
[[tool.mypy.overrides]]
module = ["scapy", "scapy.*"]
ignore_missing_imports = true
