name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install both packages and development tools
        run: uv sync --all-packages --all-extras --locked
      - name: Format, lint, types, generated docs and tests
        run: make check
