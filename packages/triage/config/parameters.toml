[dns.min_packets]
value = 100
fitted_on = "inherited"
target = ""
effect = "Applies to ratio metrics only, against the client-day denominator. Still unjustified, and re-measured 2026-10-23 on the DNS population primary-detectors-v8 scores (clients that sent a query, DNS servers left out): 47-49% of those client-days carry 100 query and response packets, over 2026-08-24..30 and 2026-10-15..21 alike. The earlier statement that it suppressed nine client-days in ten counted addresses that sent no query at all (CASE_STUDY, superseded values). CASE_STUDY §9."
status = "inherited-unjustified"
[dns.min_sessions]
value = 50
fitted_on = "inherited"
target = ""
effect = "Applies to ratio metrics only, against the client-day denominator. Still unjustified. Re-measured 2026-10-23 on the DNS population primary-detectors-v8 scores: client-days carry a median of about 30 sessions and a p90 of 800-1,650, and 37% (2026-08-24..30) to 44% (2026-10-15..21) reach 50. Deliberately NOT reused as dns.new_resolver_min_sessions, which counts one resolver rather than a client-day. CASE_STUDY §9."
status = "inherited-unjustified"
[dns.new_resolver_min_sessions]
value = 10
fitted_on = "2026-08-31, flow.dns_pairs over 2026-08-10..2026-08-30; re-measured 2026-10-23"
target = "How much a new resolver must carry on day D, in sessions on that resolver alone, before its novelty is worth reporting"
effect = "Implemented in primary-detectors-v7, with a second condition that is not a number: a client with no prior DNS day reports no novelty at all. The v7 fit measured new_resolver firing for 60-85% of the addresses the source carried; most of those addresses had sent no query (804 of 1,057 on 2026-08-30), which primary-detectors-v8 removes before novelty is computed, so a stray unsolicited response no longer makes a prior DNS day either. Re-measured 2026-10-23 on the clients that query, without DNS servers: a queried (client, resolver) pair carries a median of 12-15 sessions a day and a p75 of 24-26, so at 10 a new resolver still has to be used about as heavily as an ordinary one. Value kept. What it does NOT repair: the novelty strength is still 1 - broadest/N, not a calibrated tail; N is now the DNS population, watched by drift.dns_population_step_fraction. CASE_STUDY §9; the v7 fitting record is in CASE_STUDY, superseded values."
status = "calibrated"

[dns.server_min_resolvers]
value = 100
fitted_on = "2026-10-23, flow.dns_pairs over 2026-07-01..2026-10-22"
target = "A client-day that sent queries to at least this many distinct resolvers is a DNS server and is out of the DNS family"
effect = "primary-detectors-v8. Client-days with a query sit at p50 3 and p90 4 resolvers; 556 fall in [10, 100), 10 in [100, 1,000) and 421 at 1,000 or more, on 7 addresses (3-5 a day) that carry 15-31% of complete sessions. Those addresses are campus resolvers asking authoritative servers, every new one of which read as a new resolver: they carried 129 of the 335 DNS episodes published 2026-09-01..10-18, one host on 43 of 45 days. Anywhere in [100, 1,000) separates the same addresses. CASE_STUDY §9."
status = "calibrated"

[dns.service_time_role]
value = "shared context"
fitted_on = "2026-08-31, flow.dns_pairs on 2026-08-30"
target = "Whether mean_service_nanos may establish a DNS episode, or only accompany one"
effect = "Demoted to context in primary-detectors-v7. Service time is what a resolver did, measured through whichever clients happened to ask it: 56.5% of the variance in per-(client, resolver) mean service time sat between resolvers rather than within them on 2026-08-30, so when a resolver slows every client behind it deviates on the same day and one incident arrives as a burst of candidates attributed to hosts. The metric is still emitted as DNS_SERVICE_TIME evidence with its strength; it no longer counts toward the strong-or-two-moderate eligibility test and no longer sets the family strength. Not a number, and recorded here for the same reason long_flow.corroboration_rule was. The decomposition was taken over pairs on resolvers that three or more addresses used, which an address that sent no query cannot be part of; it was not re-measured. CASE_STUDY, superseded values."
status = "calibrated"

