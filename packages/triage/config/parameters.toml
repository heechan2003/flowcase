# ---------------------------------------------------------------------------
# Population and drift — new
# ---------------------------------------------------------------------------

[population.support_definition]
value = "unique_services >= 1"
fitted_on = "2026-10-23, history.client_day and history.client_service_day over 2026-09-01..2026-10-18, and the published stream for the same days"
target = "Which observed addresses the activity families (transfer, fanout) score and rank against: those with at least one row that resolved to a service"
effect = "behavioural-support-v3. Not a threshold on quietness — one service row admits an address — but whether any of its traffic can be interpreted. 60-75% of observed addresses carry only unaddressed Web Browsing rows with no server, port or domain (CASE_STUDY §3); under v2 they were scored as 'unusual external transfer' and 'external fanout change' on those bytes, produced 11 of 390,056 published episodes (2026-09-01..10-18), and made up 6,801 of the 6,967 members of the lowest destination band's peer pool on 2026-10-14, the pool 166 addressed hosts were ranked against. baseline-calibration-v7 draws peer and calibration pools from the same admitted client-days. That, not the scope gate, is what moves the output: re-scored from the same history on 2026-10-14 and 10-18, no removed episode was on an out-of-scope address, and against peers with interpretable traffic transfer fell 63 -> 20 and 112 -> 18, fanout 101 -> 35 and 130 -> 28, and E1 53 -> 25 and 91 -> 18 (evidence bundle 2026-10-23). DNS is not gated: activity_1m carries no DNS rows, so a DNS-only address has no service row, and the DNS family scores its own population (CASE_STUDY §9). The admitted population is exactly the scored population drift.population_step gates. v1 (active_5m_buckets >= 10 or flow_count >= 100) and v2 (ungated) are kept in network_behaviour.population for replay. CASE_STUDY §2, §3."
status = "calibrated"

[drift.population_step_fraction]
value = 0.35
fitted_on = "2026-10-23, history.client_service_day over 2026-06-29..2026-10-18, 75 same-weekday pairs"
target = "Fail closed when the scored population (addresses with at least one service row) moves more than this fraction against the most recent retained day with the same UTC weekday"
effect = "drift-gates-v2. The scored population tracks the week (about 2,800 addresses on a UTC Saturday, 4,500 on a Tuesday; day-over-day median 13.0%, max 33.8%), so it is compared weekday to weekday: median 1.67%, p90 4.26%, max 30.87% (2026-10-04 -> 10-11, the public-holiday rebound), and at most 5.4% for every pair outside those weeks, including pairs 28-35 days apart across retention gaps. 0.35 passes all 75 and fails a halving; the margin over the holiday is 4.1 points. Replaces drift-gates-v1's 0.44, which gated every observed address: 60-75% of those carry only unaddressed rows (CASE_STUDY §3), and the two seams v1 was widened for (0.20 -> 0.30 on 2026-09-10, -> 0.44 on 2026-09-27) were steps in those addresses alone, while the scored population rose. CASE_STUDY §2. See CASE_STUDY, evaluations (2026-10-23-drift-gates-v2-scored-population)."
status = "calibrated"

[drift.composition_tvd]
value = 0.05
fitted_on = "2026-08-25, history.client_service_day over 2026-06-29..2026-08-09, 36 comparisons"
target = "Fail closed when the service_basis mix moves further than this against the most recent published day"
effect = "Catches the source measuring a different thing rather than a different amount — an upstream change that stopped resolving domains would move every service identity off the domain basis (98.75% of rows on 2026-08-09) without touching the address count. Legitimate day-over-day TVD measured median 0.00086, p90 0.00234, max 0.00281. FITTED ON THE LEGITIMATE SIDE ONLY: the 2026-08-11 step is outside retained history and outside the source detail window, so no observed failure calibrates the other side. At ~18x the loudest legitimate day this is a guard against gross redefinition, not a tuned detector."
status = "provisional"

[drift.dns_population_step_fraction]
value = 0.35
fitted_on = "2026-10-23, flow.dns_pairs over 2026-07-01..2026-10-22, 107 same-weekday pairs"
target = "Disable the DNS family for the day, never the day itself, when the DNS population (clients that sent a query, DNS servers left out) moves more than this against the most recent day with the same UTC weekday"
effect = "drift-gates-v3. The DNS population is about 308 addresses a day and follows the week (Saturday 221, Wednesday 326). Same-weekday movement: median 4.8%, p90 14.9%. Above 20% sit 2026-09-14 (24%, incomplete source ingestion), 09-21 (32%, against it), 10-12 (21%, a public holiday), and 07-23 (70%) and 07-30 (43%), not explained; 0.35 passes all but those two. A failure costs one day of DNS episodes, so the tolerance sits nearer the legitimate range than drift.population_step_fraction can. Before v3 nothing watched this population, and backscatter on 864 to 64,000 addresses a day moved the DNS denominator unseen. CASE_STUDY §9. See CASE_STUDY, evaluations (2026-10-23-dns-population-primary-detectors-v8)."
status = "calibrated"

