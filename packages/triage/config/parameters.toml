[long_flow.min_bytes]
value = 1000000
fitted_on = "inherited"
target = ""
effect = "Removes 0.16% of flow.long_flows; the table already contains only long flows. Nearly every address with traffic of its own has a qualifying flow (92% on 2026-10-21; 80% of active addresses on 2026-08-11), and half of the service-days carrying one on 2026-08-09 moved under 5 MB in under half a minute. Still unjustified and still not selective; what changed in episode-ordering-v4 is that clearing it is no longer sufficient to promote a tier, so it now admits context rather than deciding a tier. CASE_STUDY §8."
status = "inherited-unjustified"

[long_flow.corroboration_rule]
value = "presence"
fitted_on = "inherited"
target = ""
effect = "RETIRED in episode-ordering-v4 / primary-detectors-v6, replaced by long_flow.corroboration_strength. Was: presence of any filtered large flow promotes an episode a full tier. It promoted on a condition true of 80% of active addresses and 26.01% of eligible relationship units on 2026-08-09, and §2 of the I4 bundle found it invariant under host-label permutation — it carried no information about the host it was attached to. No longer read by any file in src/."
status = "retired"

[long_flow.corroboration_strength]
value = 97.5
fitted_on = "2026-08-31, history.client_service_day over 2026-08-09 with reference pools from the preceding 90 days"
target = "How unusual a large flow must be for the host that made it before it promotes an episode a full tier: the top 2.5% of that host's own prior large flows, on size or on duration"
effect = "Corroboration went from a condition true of 26.01% of eligible relationship units to one true of 0.60% (818 -> 19 of 3,145) on 2026-08-09, and the top tier from 495 episodes to 49. Episodes and queued hosts are unchanged at 4,120 over 860: this moves tiers, not eligibility. The smaller number is not the point — under the §2 permutation null the retired presence condition was invariant to the host label (26.01% observed against 25.89% permuted) and this one moves (0.60% against 1.84%), so the top tier now responds to the host rather than to the shape of the data. Cost measured in the same bundle and not fixed: the tied share of the queue rose 59.07% to 70.2%, because the ordering key's corroboration term now splits 49 episodes rather than 495. At the client-day grain the size axis also remains close to invariant (4.98% against 5.10%), because a daily maximum over many flows is compared against a pool of individual ones. CASE_STUDY §8. See CASE_STUDY, evaluations (2026-08-31-r2-large-flow-corroboration-qualified-primary-detectors-v6)."
status = "calibrated"

[long_flow.reference_days]
value = 90
fitted_on = "2026-08-31, history.client_service_day over 2026-08-09"
target = "The window of a host's own large flows a new one is qualified against"
effect = "Held equal to calibration.population_lookback_days rather than introducing a second window with a second justification. Not binding in this deployment yet: retained history began 2026-06-29, so on 2026-08-09 the window covers all 42 retained days and every pool is as deep as the data allows — median 287 prior large flows per host, p10 68, p90 760. It begins to bind once retained history exceeds 90 days, which is the point of setting it below the 365-day retention: a host is qualified against what it has been doing lately, not against a year ago. CASE_STUDY §8."
status = "calibrated"

[long_flow.reference_min_units]
value = 40
fitted_on = "2026-08-31, arithmetic reachability, checked against history.client_service_day over 2026-08-09"
target = "Refuse to qualify a large flow when the host has too few of its own to place one in a 2.5% tail"
effect = "Costs 18 qualifying units of 1,150 on 2026-08-09 (1.6%), and stops 666 of the 29,488 service-days carrying a large flow (2.26%) from being qualified at all. The floor is arithmetic: empirical_percentile_sorted is a midpoint rank, so the most extreme value in a pool of n scores (n - 0.5)/n and a pool below 20 cannot place anything in a 2.5% tail; 40 leaves the tail two units of resolution. It costs no episode a tier it could otherwise have reached — a host too new to have 40 prior large flows has cold or limited history, and tier_confidence_cap already caps such an episode below E1 (docs/generated/ordering.md). bands.min_cohort applies the same guard (R5, baseline-calibration-v6). CASE_STUDY §4, §8."
status = "calibrated"

