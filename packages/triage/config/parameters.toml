fitted_on = "inherited"
target = ""
effect = "Retained in baseline-calibration-v6. Measured 2026-09-08 over the 7-day median ending 2026-08-09 with the degenerate minutes dimension dropped: 18 of 25 bytes-by-destination bands occupied; the largest holds 8,360 of 12,235 addresses (68.3%, under 5 destinations at 1-10 MiB a day) and the next 1,505 (12.3%). CASE_STUDY §4."
status = "inherited-unjustified"

[bands.minute_edges]
value = [15, 60, 240, 720]
fitted_on = "inherited"
target = ""
effect = "RETIRED in baseline-calibration-v6. Was: a third peer-band dimension alongside bytes and destinations. Measured 2026-08-09 (single day) and re-measured 2026-09-08 over the 7-day median every band is actually built from: 96.6% and 98.98% of addresses respectively sit at 1,440 active minutes, the daily maximum, so the dimension never separated a cohort and only fragmented the ones bytes and destinations already separate. Dropping it took occupied bands from 23 of 125 to 18 of 25 and roughly halved the addresses sitting below any usable cohort size (below n=40: 91, against demonstrably more under the retired 3-dimensional band at the same floor). No longer read by any file in src/. CASE_STUDY §3, §4."
