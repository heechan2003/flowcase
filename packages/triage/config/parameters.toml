[shadow.beacon_min_active_buckets]
value = 6
fitted_on = "2026-09-08, history.client_service_day over 2026-08-09"
target = "Fewest active 5-minute buckets before an inter-bucket CV is a meaningful measure of regularity"
effect = "Swept 3 to 8. Below 6, pairs with only 3-5 active buckets pass the regularity stage on coincidence — a CV over one or two gaps is not a measurement — inflating candidates past the rarity stage from 17 to 45 at 3, visibly noisier and less periodic. Not a rescaling of the review's minute-grain floor (12 active minutes): minute and bucket occupancy are not related by a fixed factor. CASE_STUDY §13."
status = "calibrated"

[shadow.beacon_max_active_buckets]
value = 80
fitted_on = "2026-09-08, history.client_service_day over 2026-08-09"
target = "Upper bound matching the review's 400-active-minute ceiling, held at the same ratio to the day"
effect = "Excludes near-continuous, high-frequency relationships from a shape meant to select infrequent contact. Not independently swept; carried over from the review's own choice at the equivalent share of the day (400/1440 minutes ~ 80/288 buckets), which is a weaker basis than a value fitted directly against this measurement. CASE_STUDY §13."
status = "calibrated"

[shadow.beacon_max_cv]
value = 0.15
fitted_on = "2026-08-18, flow.activity_1m (timing.max_cv), reused unchanged"
target = "Select machine-regular inter-contact timing"
effect = "A coefficient of variation is already unitless, so this crosses the minute-to-bucket grain change without rescaling. Reused rather than re-derived at bucket grain. CASE_STUDY §10, §13."
status = "calibrated"

[shadow.beacon_min_mean_gap_buckets]
value = 2.0
fitted_on = "2026-09-08, history.client_service_day over 2026-08-09"
target = "Separate a schedule from a held-open connection, at bucket grain"
effect = "NOT a rescaling of timing.min_mean_gap_minutes (1.5 minutes): a bucket-grain gap of 1 already implies up to 5 minutes between activity, so the minute-grain contiguity trap does not transfer directly. 2 buckets (10 minutes) is a separately chosen floor; verified as a real constraint here (32,360 -> 714 pairs combined with max_cv) but not independently swept against alternative floors. CASE_STUDY §13."
status = "calibrated"

[shadow.beacon_min_span_hours]
