[bands.min_cohort]
value = 40
fitted_on = "2026-09-08, history.client_day over 2026-08-03..09, bytes-by-destination bands with active_minutes dropped"
target = "Refuse a peer-based strength when the cohort is too small for the threshold to be reachable"
effect = "Implemented in baseline-calibration-v6. A midpoint-rank percentile over n peers cannot exceed (n-0.5)/n, so a cohort below 20 cannot place any address in the moderate_strength (97.5) tail regardless of behaviour, and 20 itself passes only the single most extreme peer with nothing to spare. Held equal to long_flow.reference_min_units rather than the exact boundary, for the same reason: two units of resolution above it. Costs 91 of 12,235 addresses (0.74%) their peer percentile on this measurement, across 4 of 18 occupied bands — the same guard at the exact boundary (20) would have cost only 6, across 1 band. Those addresses still register a self-comparison where their own history supports one; what they lose is the peer term, and metric_strength = min(self, peer) already required both, so the practical effect is that a metric with no self-history AND a peer cohort below 40 now reports no strength instead of one no cohort that size could ever support. CASE_STUDY §4."
status = "calibrated"

