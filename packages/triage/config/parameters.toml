# Tier 2 — calibrated parameters
#
# Every tuned number in the product lives here. None appear in PRODUCT_CONTRACT.md.
#
# Each entry carries:
#   value        the number in force
#   fitted_on    date + data range it was fitted against, or "inherited" if never fitted
#   target       the quantity it was chosen to achieve
#   effect       the measured consequence, with a docs/CASE_STUDY.md section reference
#   status       "calibrated" | "inherited-unjustified" | "provisional" | "retired"
#
# status = "inherited-unjustified" means the value arrived from v1 of the contract and no
# record exists of what it was chosen to achieve. That is the honest state of most of this
# file. Making the debt countable is the point of writing it down.
#
# Changing any value requires the evidence bundle in docs/EVALUATION.md.

schema_version = 1
generated_doc = "docs/generated/parameters.md"

